
name: Update CTF index

on:
  push:
    branches:
      - main
    paths:
      - '[0-9][0-9][0-9][0-9]/**'
      - '.github/scripts/**'
      - '.github/workflows/update-ctf-index.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctf-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate CTF index
        run: python .github/scripts/generate_index.py --root "$GITHUB_WORKSPACE"

      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add README.md .github/scripts/ctftime-cache.json

          if ! git diff --cached --quiet; then
            git commit -m 'docs: update CTF index'
            git push
          else
            echo 'No changes to commit.'
          fi

